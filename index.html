<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<!-- xlsx-js-style: suporte completo a estilos de célula (cores, bordas, fontes) -->
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<!-- Firebase via jsdelivr -->
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.0/firebase-app-compat.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.0/firebase-firestore-compat.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f4f6f4;font-size:14px}

/* ── LOGO DE FUNDO — só na aba de Atendimento ── */
#page-atendimento{
  background-repeat:no-repeat;
  background-position:center 140px;
  background-size:300px auto;
}

/* ── HEADER ── */
.header{
  padding:16px 22px 14px;
  background:linear-gradient(135deg,#0d3b1a 0%,#1a5c2a 60%,#2e8049 100%);
  display:flex;align-items:center;gap:16px;
  box-shadow:0 3px 12px rgba(0,0,0,.25);position:relative;z-index:10
}
.logo-wrap{
  width:58px;height:58px;border-radius:50%;
  background:rgba(255,255,255,0.12);
  border:2px solid rgba(255,255,255,0.3);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;flex-shrink:0
}
.logo-wrap img{width:48px;height:48px;object-fit:contain;filter:brightness(0) invert(1)}
.header-text h1{font-size:18px;font-weight:800;color:#fff;letter-spacing:.03em}
.header-text p{font-size:12px;color:rgba(255,255,255,.7);margin-top:3px;font-style:italic}

/* ── TABS ── */
.tabs{
  display:flex;border-bottom:2px solid #d4edda;
  padding:0 22px;gap:2px;background:#fff;
  box-shadow:0 1px 4px rgba(0,0,0,.06);position:relative;z-index:5
}
.tab{
  padding:12px 20px;font-size:13px;font-weight:700;cursor:pointer;
  border:none;border-bottom:3px solid transparent;
  background:none;color:#888;transition:all .15s;margin-bottom:-2px
}
.tab.active{color:#1a5c2a;border-bottom-color:#1a5c2a}
.tab:hover:not(.active){color:#2e8049;background:#f0faf2}

/* ── PAGES ── */
.page{display:none;padding:18px 22px;position:relative;z-index:1}
.page.active{display:block}

/* ── PATIENT SECTION ── */
.patient-section{
  background:#fff;border:1px solid #d4edda;border-radius:12px;
  padding:16px 18px 18px;margin-bottom:18px;
  box-shadow:0 2px 8px rgba(26,92,42,.08)
}
.patient-grid{display:grid;grid-template-columns:1fr 1fr 170px;gap:14px;margin-bottom:16px}
.field label{font-size:11px;font-weight:700;color:#5a7060;display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
.field input{
  width:100%;font-size:13px;padding:9px 11px;
  border:1.5px solid #cde0d2;border-radius:8px;background:#f9fdf9;
  outline:none;transition:all .15s
}
.field input:focus{border-color:#1a5c2a;background:#fff;box-shadow:0 0 0 3px rgba(26,92,42,.1)}
.btn-new-att{
  width:100%;padding:14px 0;font-size:15px;font-weight:800;cursor:pointer;
  border:none;border-radius:10px;
  background:linear-gradient(135deg,#1a5c2a 0%,#2e8049 100%);
  color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 3px 10px rgba(26,92,42,.3);transition:all .15s;letter-spacing:.02em
}
.btn-new-att:hover{
  background:linear-gradient(135deg,#0d3b1a 0%,#1a5c2a 100%);
  box-shadow:0 5px 16px rgba(26,92,42,.4);transform:translateY(-1px)
}

/* ── SECTION LABEL ── */
.section-label{
  font-size:11px;font-weight:700;color:#888;
  margin-bottom:12px;text-transform:uppercase;letter-spacing:.07em
}

/* ── CARDS ── */
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:14px}
.att-card{
  background:#fff;border:1.5px solid #d4edda;border-radius:12px;
  overflow:hidden;box-shadow:0 2px 10px rgba(26,92,42,.08);transition:all .15s
}
.att-card.selected{border-color:#1a5c2a;box-shadow:0 0 0 3px rgba(26,92,42,.18)}
.card-head{
  padding:12px 16px;
  background:linear-gradient(90deg,#1a5c2a 0%,#34a853 100%);
  display:flex;align-items:center;gap:8px
}
.card-select-wrap{display:flex;align-items:center;gap:7px;flex:1}
.card-select-wrap input[type=checkbox]{width:17px;height:17px;accent-color:#fff;cursor:pointer;flex-shrink:0}
.card-title{font-size:13px;font-weight:700;color:#fff}
.card-total-badge{
  font-size:12px;font-weight:700;color:#d4f5dc;
  background:rgba(0,0,0,.2);padding:3px 11px;
  border-radius:999px;margin-left:auto
}
.products-list{padding:10px 14px;display:flex;flex-direction:column;gap:8px;min-height:56px}
.product-row{display:flex;align-items:center;gap:7px}
.product-row select{
  flex:1;font-size:12px;padding:7px 8px;
  border:1px solid #cde0d2;border-radius:7px;background:#f9fdf9;outline:none
}
.product-row select:focus{border-color:#1a5c2a}
.product-row input[type=number]{
  width:54px;font-size:12px;padding:7px 4px;
  border:1px solid #cde0d2;border-radius:7px;text-align:center;background:#f9fdf9;outline:none
}
.sub-val{font-size:12px;font-weight:700;min-width:68px;text-align:right;color:#1a5c2a}
.rm-btn{
  background:none;border:none;cursor:pointer;color:#bbb;
  font-size:17px;padding:2px 5px;border-radius:5px;line-height:1;transition:all .12s
}
.rm-btn:hover{background:#fce8e8;color:#c0392b}
.add-product-btn{
  display:flex;align-items:center;gap:9px;padding:10px 16px;
  font-size:13px;font-weight:600;cursor:pointer;color:#1a5c2a;
  background:none;border:none;border-top:1px solid #e8f5e9;width:100%;transition:background .12s
}
.add-product-btn:hover{background:#f0faf2}
.add-product-btn .plus-icon{
  width:23px;height:23px;background:#1a5c2a;color:#fff;
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:700;flex-shrink:0
}
.card-footer{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px;border-top:1px solid #e8f5e9;background:#f9fdf9
}
.cf-total{display:flex;align-items:baseline;gap:7px}
.cf-label{font-size:11px;color:#888;font-weight:600;text-transform:uppercase}
.cf-val{font-size:17px;font-weight:800;color:#1a5c2a}
.del-card-btn{
  display:flex;align-items:center;gap:5px;font-size:12px;padding:7px 13px;
  cursor:pointer;border-radius:7px;background:#fff0f0;color:#c0392b;
  border:1px solid #f5c6c6;font-weight:600;transition:all .12s
}
.del-card-btn:hover{background:#fce8e8}

/* ── MÃO DE OBRA SELECTOR ── */
.mo-bar{
  display:flex;align-items:center;gap:8px;padding:8px 14px;
  border-top:1px solid #e8f5e9;background:#f5fff7;flex-wrap:wrap
}
.mo-bar label{font-size:11px;font-weight:700;color:#1a5c2a;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.mo-select{
  font-size:12px;padding:6px 8px;border:1.5px solid #cde0d2;
  border-radius:7px;background:#fff;outline:none;color:#1a1a1a;cursor:pointer
}
.mo-select:focus{border-color:#1a5c2a}
.mo-row{
  display:flex;align-items:center;gap:8px;padding:7px 14px;
  background:#e8f5e9;border-top:1px dashed #b7e4c7
}
.mo-row-label{flex:1;font-size:12px;font-weight:700;color:#1a5c2a}
.mo-row-detail{font-size:11px;color:#5a7060}
.mo-row-val{font-size:13px;font-weight:800;color:#1a5c2a;min-width:72px;text-align:right}

/* ── ENFERMEIRO BAR ── */
.enf-bar{
  display:flex;align-items:center;gap:10px;padding:9px 14px;
  border-top:1px solid #dde8ff;background:#f0f4ff;flex-wrap:wrap
}
.enf-bar label{font-size:11px;font-weight:700;color:#1a3c8f;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.enf-select{
  flex:1;min-width:180px;font-size:12px;padding:7px 10px;
  border:1.5px solid #b3c6f7;border-radius:8px;
  background:#fff;outline:none;color:#1a1a1a;cursor:pointer
}
.enf-select:focus{border-color:#1a3c8f;box-shadow:0 0 0 3px rgba(26,60,143,.1)}
.enf-row{
  display:flex;align-items:center;gap:10px;padding:8px 14px;
  background:#e8eeff;border-top:1px dashed #b3c6f7
}
.enf-avatar{
  width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;background:#fff;border:2px solid #b3c6f7;flex-shrink:0
}
.enf-info{flex:1}
.enf-name{font-size:13px;font-weight:700;color:#1a3c8f}
.enf-role{font-size:11px;color:#7a8fbf}

/* ── DIFF ── */
.diff-area{display:flex;justify-content:center;margin-bottom:16px}
.diff-chip{
  font-size:12px;padding:7px 18px;border-radius:999px;
  border:1px solid #d4edda;color:#1a5c2a;background:#f0faf2;font-weight:700
}

/* ── ACTIONS ── */
.actions-bar{
  display:flex;gap:10px;justify-content:flex-end;
  padding-top:14px;border-top:1px solid #e8f5e9
}
.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:11px 22px;font-size:13px;font-weight:700;
  border-radius:9px;cursor:pointer;transition:all .12s
}
.btn-save-sel{
  background:linear-gradient(135deg,#1a5c2a,#34a853);
  color:#fff;border:none;box-shadow:0 2px 8px rgba(26,92,42,.28)
}
.btn-save-sel:hover{box-shadow:0 5px 14px rgba(26,92,42,.4);transform:translateY(-1px)}
.btn-del-all{background:#fff0f0;color:#c0392b;border:1px solid #f5c6c6}
.btn-del-all:hover{background:#fce8e8}

/* ── NOTIF ── */
.notif{
  position:fixed;top:16px;right:16px;padding:12px 20px;border-radius:10px;
  font-size:13px;font-weight:700;display:none;z-index:9999;
  box-shadow:0 4px 16px rgba(0,0,0,.15)
}
.notif.show{display:flex;align-items:center;gap:8px}
.notif.ok{background:#f0faf2;color:#1a5c2a;border:1px solid #b7e4c7}
.notif.err{background:#fff0f0;color:#c0392b;border:1px solid #f5c6c6}

/* ── MODAL ── */
.modal-bg{
  display:none;position:fixed;inset:0;z-index:8888;
  background:rgba(0,0,0,.55);align-items:center;justify-content:center
}
.modal-bg.open{display:flex}
.modal-box{
  background:#fff;border-radius:14px;border:1px solid #d4edda;
  width:460px;max-width:95vw;max-height:84vh;
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 10px 40px rgba(0,0,0,.22)
}
.modal-head{
  padding:15px 20px;
  background:linear-gradient(90deg,#1a5c2a,#34a853);
  display:flex;align-items:center;justify-content:space-between
}
.modal-head span{color:#fff;font-size:14px;font-weight:800}
.modal-close{
  background:rgba(255,255,255,.2);border:none;color:#fff;cursor:pointer;
  padding:5px 11px;border-radius:7px;font-size:14px;font-weight:700;transition:background .12s
}
.modal-close:hover{background:rgba(255,255,255,.38)}
.modal-body{padding:18px 20px;overflow-y:auto}
.mrow{
  display:flex;justify-content:space-between;align-items:center;
  padding:9px 0;border-bottom:1px solid #f0f0f0;font-size:13px
}
.mrow:last-of-type{border-bottom:none}
.mtotal{
  display:flex;justify-content:space-between;padding:13px 0 0;
  font-weight:800;font-size:15px;border-top:2px solid #d4edda;margin-top:6px;color:#1a5c2a
}
.minfo{font-size:12px;color:#888;margin-bottom:13px;padding-bottom:10px;border-bottom:1px dashed #d4edda}

/* ── HISTÓRICO ── */
.hist-bar{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;gap:10px;flex-wrap:wrap
}
.btn-export{
  display:inline-flex;align-items:center;gap:7px;padding:11px 20px;
  font-size:13px;font-weight:700;border-radius:9px;cursor:pointer;
  background:linear-gradient(135deg,#1565c0,#1976d2);
  color:#fff;border:none;box-shadow:0 2px 8px rgba(21,101,192,.3);transition:all .12s
}
.btn-export:hover{box-shadow:0 5px 14px rgba(21,101,192,.45);transform:translateY(-1px)}
.btn-clear-hist{
  display:inline-flex;align-items:center;gap:6px;padding:10px 15px;
  font-size:13px;font-weight:700;border-radius:9px;cursor:pointer;
  background:#fff0f0;color:#c0392b;border:1px solid #f5c6c6;transition:all .12s
}
.btn-clear-hist:hover{background:#fce8e8}

/* ── TABELA HISTÓRICO ── */
.hist-table{width:100%;border-collapse:collapse;font-size:13px}
.hist-table th{
  text-align:left;padding:10px 12px;font-size:11px;font-weight:700;
  color:#5a7060;border-bottom:2px solid #d4edda;background:#f0faf2;
  text-transform:uppercase;letter-spacing:.06em
}
.hist-table td{padding:10px 12px;border-bottom:1px solid #eef5ee;color:#1a1a1a;vertical-align:middle}
.hist-table tr:last-child td{border-bottom:none}
.hist-table tr:hover td{background:#f9fdf9}
.tipo-badge{
  font-size:11px;padding:3px 10px;border-radius:999px;
  background:#e8f5e9;color:#1a5c2a;border:1px solid #b7e4c7;font-weight:700;white-space:nowrap
}
.btn-ver{
  display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:5px 12px;
  cursor:pointer;border-radius:7px;background:#e8f5e9;color:#1a5c2a;
  border:1px solid #b7e4c7;font-weight:700;white-space:nowrap;transition:all .12s
}
.btn-ver:hover{background:#d4edda}
.btn-del-row{
  display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:5px 12px;
  cursor:pointer;border-radius:7px;background:#fff0f0;color:#c0392b;
  border:1px solid #f5c6c6;font-weight:700;white-space:nowrap;transition:all .12s
}
.btn-del-row:hover{background:#fce8e8}

/* ── MÊS GROUP ── */
.mes-group{margin-bottom:26px}
.mes-header{
  display:flex;align-items:center;gap:12px;
  margin-bottom:12px;padding-bottom:8px;
  border-bottom:2px solid #d4edda
}
.mes-badge{
  background:linear-gradient(135deg,#1a5c2a,#34a853);
  color:#fff;font-size:12px;font-weight:800;
  padding:4px 14px;border-radius:999px;
  text-transform:uppercase;letter-spacing:.06em;
  box-shadow:0 2px 6px rgba(26,92,42,.25)
}
.mes-count{font-size:11px;color:#aaa;font-weight:600}

.empty-state{text-align:center;padding:3rem 1rem;color:#aaa;font-size:14px}
.empty-icon{font-size:38px;display:block;margin-bottom:10px}

/* ── BOTÃO FOTOS ── */
.btn-fotos{
  display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:5px 12px;
  cursor:pointer;border-radius:7px;background:#fff8e1;color:#e65100;
  border:1px solid #ffcc80;font-weight:700;white-space:nowrap;transition:all .12s
}
.btn-fotos:hover{background:#ffe0b2}
.foto-count{
  background:#e65100;color:#fff;font-size:10px;font-weight:800;
  padding:1px 6px;border-radius:999px;margin-left:2px
}

/* ── MODAL FOTOS ── */
.foto-modal-bg{
  display:none;position:fixed;inset:0;z-index:9000;
  background:rgba(0,0,0,.75);
  align-items:flex-start;justify-content:center;
  padding:20px 12px;overflow-y:auto
}
.foto-modal-bg.open{display:flex}
.foto-modal-box{
  background:#fff;border-radius:16px;
  width:660px;max-width:100%;
  display:flex;flex-direction:column;
  box-shadow:0 16px 60px rgba(0,0,0,.45);
  margin:auto
}
.foto-modal-head{
  padding:16px 22px;
  background:linear-gradient(90deg,#e65100,#ff8f00);
  display:flex;align-items:center;justify-content:space-between;
  border-radius:16px 16px 0 0;flex-shrink:0
}
.foto-modal-head span{color:#fff;font-size:14px;font-weight:800;letter-spacing:.02em}
.foto-modal-close{
  background:rgba(255,255,255,.22);border:none;color:#fff;cursor:pointer;
  padding:6px 13px;border-radius:8px;font-size:15px;font-weight:700;transition:background .12s
}
.foto-modal-close:hover{background:rgba(255,255,255,.4)}
.foto-modal-body{padding:20px 22px 24px}

/* Tabs antes/depois */
.foto-tabs{
  display:flex;gap:6px;margin-bottom:16px;
  border-bottom:2px solid #f0f0f0;padding-bottom:14px
}
.foto-tab{
  flex:1;padding:10px 8px;font-size:13px;font-weight:700;cursor:pointer;
  border:2px solid #e0e0e0;border-radius:10px;background:#fafafa;color:#999;
  transition:all .15s;text-align:center;user-select:none
}
.foto-tab:hover{border-color:#bbb;color:#555;background:#f0f0f0}
.foto-tab.active-antes{
  border-color:#1565c0;background:#e3f2fd;color:#1565c0;
  box-shadow:0 2px 8px rgba(21,101,192,.18)
}
.foto-tab.active-depois{
  border-color:#2e7d32;background:#e8f5e9;color:#2e7d32;
  box-shadow:0 2px 8px rgba(46,125,50,.18)
}

/* Upload zone — div com JS, não label, para evitar layout quebrado */
.foto-upload-zone{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;
  border:2px dashed #ffcc80;border-radius:12px;
  padding:22px 20px;
  text-align:center;margin-bottom:18px;cursor:pointer;
  transition:all .15s;background:#fffbf0;
  min-height:100px
}
.foto-upload-zone:hover{border-color:#e65100;background:#fff8e1}
.foto-upload-zone .upload-icon{font-size:30px;line-height:1}
.foto-upload-zone strong{font-size:13px;color:#e65100}
.foto-upload-zone p{font-size:11px;color:#aaa;margin:0}

/* Grid de fotos */
.foto-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
  gap:12px;margin-top:10px
}
.foto-card{
  position:relative;border-radius:10px;overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.12);cursor:pointer;
  aspect-ratio:1/1;background:#f0f0f0
}
.foto-card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
.foto-card:hover img{transform:scale(1.06)}
.foto-card .foto-del{
  position:absolute;top:5px;right:5px;background:rgba(192,57,43,.85);color:#fff;
  border:none;cursor:pointer;border-radius:50%;width:26px;height:26px;
  font-size:13px;display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .15s;font-weight:700
}
.foto-card:hover .foto-del{opacity:1}
.foto-card .foto-label{
  position:absolute;bottom:0;left:0;right:0;
  background:rgba(0,0,0,.52);color:#fff;font-size:10px;font-weight:700;
  padding:5px 6px;text-align:center;letter-spacing:.03em
}
.foto-empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;padding:2rem 1rem;color:#bbb;font-size:13px;
  border:2px dashed #e8e8e8;border-radius:12px;margin-top:4px;min-height:80px
}

/* Lightbox */
.lightbox{
  display:none;position:fixed;inset:0;z-index:9999;
  background:rgba(0,0,0,.93);align-items:center;justify-content:center
}
.lightbox.open{display:flex}
.lightbox img{
  max-width:92vw;max-height:86vh;border-radius:10px;
  box-shadow:0 4px 30px rgba(0,0,0,.6);object-fit:contain
}
.lightbox-close{
  position:absolute;top:16px;right:20px;background:rgba(255,255,255,.15);
  border:none;color:#fff;cursor:pointer;padding:8px 15px;
  border-radius:8px;font-size:16px;font-weight:700;transition:background .12s
}
.lightbox-close:hover{background:rgba(255,255,255,.3)}
.lightbox-nav{
  position:absolute;top:50%;transform:translateY(-50%);
  background:rgba(255,255,255,.15);border:none;color:#fff;cursor:pointer;
  padding:14px 18px;border-radius:10px;font-size:22px;font-weight:700;
  transition:background .12s
}
.lightbox-nav:hover{background:rgba(255,255,255,.3)}
.lightbox-nav.prev{left:16px}
.lightbox-nav.next{right:16px}
.lightbox-info{
  position:absolute;bottom:18px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.55);color:#fff;padding:7px 18px;
  border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap
}
</style>
</head>
<body>
<div id="notif" class="notif"></div>
<div id="modal-bg" class="modal-bg" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div class="modal-head"><span id="modal-title">Produtos</span><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<!-- ══════════ MODAL FOTOS ══════════ -->
<div id="foto-modal-bg" class="foto-modal-bg" onclick="if(event.target===this)closeFotoModal()">
  <div class="foto-modal-box">
    <div class="foto-modal-head">
      <span id="foto-modal-title">📷 Fotos do Paciente</span>
      <button class="foto-modal-close" onclick="closeFotoModal()">✕</button>
    </div>
    <div class="foto-modal-body">
      <div class="foto-tabs">
        <div class="foto-tab active-antes" id="tab-antes" onclick="switchFotoTab('antes')">🔵 Antes</div>
        <div class="foto-tab" id="tab-depois" onclick="switchFotoTab('depois')">🟢 Depois</div>
      </div>
      <!-- input oculto — ativado via JS -->
      <input type="file" id="foto-input" accept="image/*" multiple style="display:none" onchange="handleFotoUpload(event)">
      <div class="foto-upload-zone" id="foto-upload-zone"
           onclick="document.getElementById('foto-input').click()"
           ondragover="event.preventDefault();this.style.borderColor='#e65100'"
           ondragleave="this.style.borderColor='#ffcc80'"
           ondrop="event.preventDefault();this.style.borderColor='#ffcc80';handleFotoDrop(event)">
        <span class="upload-icon">📸</span>
        <strong>Clique ou arraste fotos aqui</strong>
        <p>JPG, PNG, WEBP — múltiplas fotos permitidas</p>
      </div>
      <div id="foto-grid-container"></div>
    </div>
  </div>
</div>

<!-- ══════════ LIGHTBOX ══════════ -->
<div id="lightbox" class="lightbox" onclick="if(event.target===this)closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <button class="lightbox-nav prev" onclick="lightboxNav(-1)">‹</button>
  <img id="lightbox-img" src="" alt="">
  <button class="lightbox-nav next" onclick="lightboxNav(1)">›</button>
  <div id="lightbox-info" class="lightbox-info"></div>
</div>

<div class="header">
  <div class="logo-wrap">
    <img id="header-logo" src="" alt="Logo Clínica Santa Marta">
  </div>
  <div class="header-text">
    <h1>Tabela de Preço — Curativo</h1>
    <p>Clínica Santa Marta &nbsp;|&nbsp; <span id="sync-status"><span style="color:rgba(255,255,255,.6);font-size:12px">⏳ Conectando...</span></span></p>
  </div>
</div>

<div class="tabs">
  <button class="tab active" onclick="showTab('atendimento')">🩺 Atendimento</button>
  <button class="tab" onclick="showTab('historico')">📋 Histórico (<span id="hist-count">0</span>)</button>
</div>

<!-- ══════════ ATENDIMENTO ══════════ -->
<div id="page-atendimento" class="page active">
  <div class="patient-section">
    <div class="patient-grid">
      <div class="field"><label>👤 Nome do Paciente</label><input type="text" id="nome" placeholder="Ex: Maria da Silva"></div>
      <div class="field"><label>🩹 Tipo de Problema</label><input type="text" id="problema" placeholder="Ex: Úlcera venosa..."></div>
      <div class="field"><label>📅 Data</label><input type="date" id="data"></div>
    </div>
    <button class="btn-new-att" onclick="addAtendimento()">➕ 🩹 Novo Atendimento</button>
  </div>
  <div class="section-label">Atendimentos em aberto — marque os que deseja salvar</div>
  <div class="compare-grid" id="compare-grid"></div>
  <div id="diff-area" class="diff-area"></div>
  <div class="actions-bar">
    <button class="btn btn-del-all" onclick="deleteAll()">🗑️ Excluir Todos</button>
    <button class="btn btn-save-sel" onclick="saveSelected()">💾 Salvar Selecionados</button>
  </div>
</div>

<!-- ══════════ HISTÓRICO ══════════ -->
<div id="page-historico" class="page">
  <div class="hist-bar">
    <div class="section-label" style="margin:0">📋 Atendimentos Salvos</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn-export" onclick="exportExcel()">📊 Exportar para Excel</button>
      <button class="btn-clear-hist" onclick="clearHistory()">🗑️ Limpar Histórico</button>
    </div>
  </div>
  <div id="history-container"></div>
</div>

// Indicador de sincronização
function setSyncStatus(status){
  const el = document.getElementById('sync-status');
  if(!el) return;
  const map = {
    loading: {icon:'⏳', txt:'Carregando...', color:'#888'},
    ok:      {icon:'✅', txt:'Sincronizado',   color:'#1a5c2a'},
    saving:  {icon:'🔄', txt:'Salvando...',    color:'#e65100'},
    error:   {icon:'❌', txt:'Erro de conexão',color:'#c0392b'},
  };
  const s = map[status] || map.ok;
  el.innerHTML = `<span style="color:${s.color};font-size:12px;font-weight:700">${s.icon} ${s.txt}</span>`;
}

// Carrega todos os atendimentos do Firestore em tempo real (listener)
function initFirestore(){
  setSyncStatus('loading');
  db.collection(COLLECTION)
    .orderBy('data', 'desc')
    .onSnapshot(snapshot => {
      history = snapshot.docs.map(doc => ({...doc.data(), _docId: doc.id}));
      firestoreLoaded = true;
      setSyncStatus('ok');
      document.getElementById('hist-count').textContent = history.length;
      renderHistory();
    }, err => {
      console.error('Firestore error:', err);
      setSyncStatus('error');
      notify('Erro ao conectar com o banco de dados.', 'err');
    });
}

// Perfil B (baixo) | M (médio) | C (complexo/especialista)
const MAO_OBRA={
  'basico':   {label:'Básico',   B:20,  M:30,  C:40 },
  'medio':    {label:'Médio',    B:40,  M:60,  C:80 },

];

function getMoVal(nivel, perfil){
  if(!nivel||nivel==='none')return 0;
  const t=MAO_OBRA[nivel];
  return t?t[perfil]||0:0;
}
function calcMoTotal(att){
  return getMoVal(att.moNivel||'none', att.moPerfil||'B');
}
function calcTotal(att){
  const prods=att.items.reduce((s,it)=>{const p=PRODUTOS.find(x=>x.n===it.prod);return s+(p?p.vc*it.qty:0);},0);
  return prods + calcMoTotal(att);
}
function opts(sel){return'<option value="">— selecione o produto —</option>'+PRODUTOS.map(p=>`<option value="${p.n}"${sel===p.n?' selected':''}>${p.n}</option>`).join('');}

// Chave de mês: "YYYY-MM"
function mesKey(data){return data?data.slice(0,7):'';}
function mesLabel(key){
  if(!key)return'Sem data';
  const [y,m]=key.split('-');
  return MESES[(parseInt(m,10)-1)]+' / '+y;
}

function showTab(t){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.textContent.toLowerCase().includes(t==='atendimento'?'atend':'hist')));
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id==='page-'+t));
  if(t==='historico')renderHistory();
}

function notify(msg,type='ok'){
  const n=document.getElementById('notif');
  n.innerHTML=(type==='ok'?'✅ ':'❌ ')+msg;
  n.className='notif '+type+' show';
  clearTimeout(n._t);n._t=setTimeout(()=>n.className='notif',3000);
}

function renderAtendimentos(){
  const grid=document.getElementById('compare-grid');
  if(!atendimentos.length){
    grid.innerHTML='<div style="grid-column:1/-1" class="empty-state"><span class="empty-icon">🩹</span>Clique em "➕ 🩹 Novo Atendimento" para começar</div>';
    document.getElementById('diff-area').innerHTML='';return;
  }
  grid.innerHTML='';
  atendimentos.forEach((att,ai)=>{
    const total=calcTotal(att);const d=document.createElement('div');
    d.className='att-card'+(att.selected?' selected':'');
    d.innerHTML=`
      <div class="card-head">
        <label class="card-select-wrap" style="cursor:pointer">
          <input type="checkbox" ${att.selected?'checked':''} onchange="toggleSelect(${ai},this.checked)">
          <span class="card-title">🩹 Novo Atendimento</span>
        </label>
        <span class="card-total-badge">${fmt(total)}</span>
      </div>
      <div class="products-list">${att.items.map((it,ii)=>rowHtml(ai,ii,it)).join('')}</div>
      <button class="add-product-btn" onclick="addItem(${ai})"><span class="plus-icon">+</span> Adicionar Produto</button>
      <div class="mo-bar">
        <label>🧑‍⚕️ Mão de Obra</label>
        <select class="mo-select" onchange="updateMo(${ai},'nivel',this.value)">
          <option value="none"${!att.moNivel||att.moNivel==='none'?' selected':''}>— sem MO —</option>
          <option value="basico"${att.moNivel==='basico'?' selected':''}>Básico</option>
          <option value="medio"${att.moNivel==='medio'?' selected':''}>Médio</option>
          <option value="complexo"${att.moNivel==='complexo'?' selected':''}>Complexo</option>
        </select>
        ${att.moNivel&&att.moNivel!=='none'?`
        <label style="margin-left:6px">Perfil</label>
        <select class="mo-select" onchange="updateMo(${ai},'perfil',this.value)">
          <option value="B"${(att.moPerfil||'B')==='B'?' selected':''}>B — R$ ${MAO_OBRA[att.moNivel]?.B||0},00</option>
          <option value="M"${(att.moPerfil||'B')==='M'?' selected':''}>M — R$ ${MAO_OBRA[att.moNivel]?.M||0},00</option>
          <option value="C"${(att.moPerfil||'B')==='C'?' selected':''}>C — R$ ${MAO_OBRA[att.moNivel]?.C||0},00</option>
        </select>`:''}
      </div>
      ${att.moNivel&&att.moNivel!=='none'?moRowHtml(att):''}
      <div class="enf-bar">
        <label>👩‍⚕️ Enfermeiro(a)</label>
        <select class="enf-select" onchange="updateEnf(${ai},this.value)">
          <option value="">— selecione o profissional —</option>
          ${ENFERMEIROS.map(e=>`<option value="${e.id}"${att.enfId===e.id?' selected':''}>${e.emoji} ${e.nome}</option>`).join('')}
        </select>
      </div>
      ${att.enfId ? enfRowHtml(att) : ''}
      <div class="card-footer">
        <div class="cf-total"><span class="cf-label">Total</span><span class="cf-val">${fmt(total)}</span></div>
        <button class="del-card-btn" onclick="deleteCard(${ai})">🗑️ Excluir</button>
      </div>`;
    grid.appendChild(d);
  });
  renderDiff();
}

function rowHtml(ai,ii,it){
  const p=PRODUTOS.find(x=>x.n===it.prod);const sub=p?p.vc*it.qty:0;
  return`<div class="product-row">
    <select onchange="updateItem(${ai},${ii},'prod',this.value)">${opts(it.prod)}</select>
    <input type="number" min="1" value="${it.qty}" onchange="updateItem(${ai},${ii},'qty',+this.value||1)">
    <span class="sub-val">${sub>0?fmt(sub):'-'}</span>
    <button class="rm-btn" onclick="removeItem(${ai},${ii})">×</button>
  </div>`;
}

function moRowHtml(att){
  const t=MAO_OBRA[att.moNivel];
  if(!t)return'';
  const perfil=att.moPerfil||'B';
  const total=getMoVal(att.moNivel,perfil);
  const serv=(total*0.7).toFixed(2).replace('.',',');
  const clin=(total*0.3).toFixed(2).replace('.',',');
  const perfilLabel={'B':'B','M':'M','C':'C'}[perfil];
  return`<div class="mo-row">
    <span class="mo-row-label">🧑‍⚕️ MO ${t.label} — Perfil ${perfilLabel}</span>
    <span class="mo-row-detail">70% Serviço: R$ ${serv} · 30% Clínica: R$ ${clin}</span>
    <span class="mo-row-val">${fmt(total)}</span>
  </div>`;
}
function updateMo(ai,campo,v){
  if(campo==='nivel'){
    atendimentos[ai].moNivel=v;
    if(!atendimentos[ai].moPerfil) atendimentos[ai].moPerfil='B';
  } else {
    atendimentos[ai].moPerfil=v;
  }
  renderAtendimentos();
}

function enfRowHtml(att){
  const e=ENFERMEIROS.find(x=>x.id===att.enfId);
  if(!e)return'';
  return`<div class="enf-row">
    <div class="enf-avatar">${e.emoji}</div>
    <div class="enf-info">
      <div class="enf-name">${e.nome}</div>
      <div class="enf-role">${e.cargo} responsável pelo atendimento</div>
    </div>
  </div>`;
}
function updateEnf(ai,v){atendimentos[ai].enfId=v;renderAtendimentos();}

function renderDiff(){
  const area=document.getElementById('diff-area');
  if(atendimentos.length<2){area.innerHTML='';return;}
  const totals=atendimentos.map(a=>calcTotal(a));
  const diff=Math.max(...totals)-Math.min(...totals);
  area.innerHTML=`<span class="diff-chip">⚖️ Diferença: <strong>${fmt(diff)}</strong></span>`;
}

function toggleSelect(ai,v){atendimentos[ai].selected=v;renderAtendimentos();}
function addItem(ai){atendimentos[ai].items.push({prod:'',qty:1});renderAtendimentos();}
function removeItem(ai,ii){atendimentos[ai].items.splice(ii,1);renderAtendimentos();}
function updateItem(ai,ii,f,v){atendimentos[ai].items[ii][f]=v;renderAtendimentos();}
function addAtendimento(){atendimentos.push({items:[{prod:'',qty:1}],selected:true});renderAtendimentos();}
function deleteCard(ai){atendimentos.splice(ai,1);renderAtendimentos();notify('Atendimento excluído.');}
function deleteAll(){if(!atendimentos.length)return;atendimentos=[];renderAtendimentos();notify('Todos excluídos.');}

function saveSelected(){
  const nome=document.getElementById('nome').value.trim()||'(sem nome)';
  const problema=document.getElementById('problema').value.trim()||'(não informado)';
  const data=document.getElementById('data').value||new Date().toISOString().slice(0,10);
  const sel=atendimentos.filter(a=>a.selected);
  if(!sel.length){notify('Marque ao menos um atendimento.','err');return;}
  let saved=0;
  sel.forEach(att=>{
    const items=att.items.filter(it=>it.prod);
    if(!items.length)return;
    const moNivel=att.moNivel||'none';
    const moPerfil=att.moPerfil||'B';
    const moTotal=calcMoTotal(att);
    const enfId=att.enfId||'';
    const registro = {
      id: Date.now()+(Math.random()*1000|0),
      nome, problema, data, items,
      moNivel, moPerfil, moTotal, enfId,
      total: calcTotal(att),
      fotos: {antes:[], depois:[]},
      criadoEm: firebase.firestore.FieldValue.serverTimestamp()
    };
    setSyncStatus('saving');
    db.collection(COLLECTION).add(registro)
      .then(() => setSyncStatus('ok'))
      .catch(e => { console.error(e); setSyncStatus('error'); notify('Erro ao salvar no servidor.','err'); });
    saved++;
  });
  if(!saved){notify('Selecione produtos nos atendimentos marcados.','err');return;}
  // Salvar no Firestore (não no localStorage)
  atendimentos=atendimentos.filter(a=>!a.selected);
  document.getElementById('nome').value='';
  document.getElementById('problema').value='';
  renderAtendimentos();
  document.getElementById('hist-count').textContent=history.length;
  notify(`${saved} atendimento(s) salvos!`);
}

// ══════════════════════════════════════════════════════════
//  HISTÓRICO — agrupado por mês
// ══════════════════════════════════════════════════════════
function renderHistory(){
  document.getElementById('hist-count').textContent=history.length;
  const c=document.getElementById('history-container');
  if(!history.length){
    c.innerHTML='<div class="empty-state"><span class="empty-icon">📋</span>Nenhum atendimento salvo ainda</div>';return;
  }

  // Ordenar do mais antigo para o mais recente
  const sorted=[...history].sort((a,b)=>a.data.localeCompare(b.data));

  // Agrupar por mês
  const grupos={};
  sorted.forEach(h=>{
    const k=mesKey(h.data);
    if(!grupos[k])grupos[k]=[];
    grupos[k].push(h);
  });

  // Renderizar grupos em ordem cronológica
  let html='';
  Object.keys(grupos).sort().forEach(k=>{
    const regs=grupos[k];
    html+=`
    <div class="mes-group">
      <div class="mes-header">
        <span class="mes-badge">📅 Demanda Mês — ${mesLabel(k)}</span>
        <span class="mes-count">${regs.length} atendimento(s)</span>
      </div>
      <table class="hist-table">
        <thead><tr>
          <th>#</th><th>Paciente</th><th>Problema</th><th>Data</th>
          <th>Enfermeiro(a)</th><th>Produtos</th><th>Fotos</th><th>Total</th><th>Ações</th>
        </tr></thead>
        <tbody>
          ${regs.map(h=>{
            const gi=history.indexOf(h);
            return`<tr>
              <td style="color:#aaa;font-size:12px">${gi+1}</td>
              <td style="font-weight:700">${h.nome}</td>
              <td><span class="tipo-badge">${h.problema}</span></td>
              <td style="color:#888;white-space:nowrap;font-size:12px">${h.data}</td>
              <td style="white-space:nowrap;font-size:12px">${(()=>{const e=ENFERMEIROS.find(x=>x.id===h.enfId);return e?`${e.emoji} ${e.nome}`:'<span style="color:#ccc">—</span>';})()}</td>
              <td><button class="btn-ver" onclick="openModal(${gi})">👁️ Ver (${h.items.length})</button></td>
              <td>
                <button class="btn-fotos" onclick="openFotoModal(${gi})">
                  📷 Fotos${(h.fotos&&(h.fotos.antes||[]).length+(h.fotos.depois||[]).length>0)?`<span class="foto-count">${(h.fotos.antes||[]).length+(h.fotos.depois||[]).length}</span>`:''}
                </button>
              </td>
              <td style="font-weight:700;color:#1a5c2a;white-space:nowrap">${fmt(h.total)}</td>
              <td><button class="btn-del-row" onclick="deleteHistory(${gi})">🗑️ Excluir</button></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`;
  });
  c.innerHTML=html;
}

function openModal(i){
  const h=history[i];
  document.getElementById('modal-title').textContent=`🩹 ${h.nome} — ${h.data}`;
  document.getElementById('modal-body').innerHTML=
    `<div class="minfo">Problema: <strong>${h.problema}</strong></div>`+
    h.items.map(it=>{
      const p=PRODUTOS.find(x=>x.n===it.prod);const sub=p?p.vc*it.qty:0;
      return`<div class="mrow"><span>${it.qty}x ${it.prod}</span><span style="font-weight:700;color:#1a5c2a">${fmt(sub)}</span></div>`;
    }).join('')+
    (h.moNivel&&h.moNivel!=='none'?(()=>{
      const t=MAO_OBRA[h.moNivel];const mt=h.moTotal||0;
      const serv=(mt*0.7).toFixed(2).replace('.',',');
      const clin=(mt*0.3).toFixed(2).replace('.',',');
      return`<div class="mrow" style="background:#e8f5e9;border-radius:6px;padding:7px 10px;margin-top:4px">
        <span>🧑‍⚕️ MO ${t?t.label:''} <small style="color:#888">(70% R$ ${serv} · 30% R$ ${clin})</small></span>
        <span style="font-weight:700;color:#1a5c2a">${fmt(mt)}</span>
      </div>`;
    })():'') +
    (h.enfId?(()=>{
      const e=ENFERMEIROS.find(x=>x.id===h.enfId);
      return e?`<div class="mrow" style="background:#f0f4ff;border-radius:6px;padding:8px 12px;margin-top:6px;display:flex;align-items:center;gap:10px">
        <span style="font-size:20px">${e.emoji}</span>
        <div><div style="font-weight:700;color:#1a3c8f;font-size:13px">${e.nome}</div>
        <div style="font-size:11px;color:#7a8fbf">${e.cargo} responsável</div></div>
      </div>`:'';
    })():'') +
    `<div class="mtotal"><span>Total cobrado</span><span>${fmt(h.total)}</span></div>`;
  document.getElementById('modal-bg').classList.add('open');
}

function closeModal(){document.getElementById('modal-bg').classList.remove('open');}
function deleteHistory(i){
  const h = history[i];
  if(!h) return;
  if(!confirm(`Excluir atendimento de "${h.nome}"? Esta ação não pode ser desfeita.`)) return;
  if(h._docId){
    setSyncStatus('saving');
    db.collection(COLLECTION).doc(h._docId).delete()
      .then(() => { setSyncStatus('ok'); notify('Registro excluído.'); })
      .catch(e => { console.error(e); setSyncStatus('error'); notify('Erro ao excluir.','err'); });
  }
}
function clearHistory(){
  if(!history.length) return;
  if(!confirm('Limpar TODO o histórico? Esta ação não pode ser desfeita.')) return;
  setSyncStatus('saving');
  const batch = db.batch();
  history.forEach(h => { if(h._docId) batch.delete(db.collection(COLLECTION).doc(h._docId)); });
  batch.commit()
    .then(() => { setSyncStatus('ok'); notify('Histórico limpo.'); })
    .catch(e => { console.error(e); setSyncStatus('error'); notify('Erro ao limpar.','err'); });
}

// ══════════════════════════════════════════════════════════
//  SISTEMA DE FOTOS ANTES / DEPOIS
// ══════════════════════════════════════════════════════════
let fotoIdx=null;        // índice do registro aberto
let fotoTab='antes';     // aba ativa: 'antes' | 'depois'
let lbImages=[];         // array de src para lightbox
let lbCurrent=0;         // índice atual no lightbox

function openFotoModal(i){
  fotoIdx=i;
  fotoTab='antes';
  const h=history[i];
  document.getElementById('foto-modal-title').textContent=`📷 ${h.nome} — ${h.data}`;
  switchFotoTab('antes');
  document.getElementById('foto-modal-bg').classList.add('open');
}
function closeFotoModal(){
  document.getElementById('foto-modal-bg').classList.remove('open');
  fotoIdx=null;
}

function switchFotoTab(tab){
  fotoTab=tab;
  const tA=document.getElementById('tab-antes');
  const tD=document.getElementById('tab-depois');
  tA.className='foto-tab'+(tab==='antes'?' active-antes':'');
  tD.className='foto-tab'+(tab==='depois'?' active-depois':'');
  renderFotoGrid();
}

function handleFotoUpload(e){
  if(fotoIdx===null)return;
  const files=Array.from(e.target.files);
  if(!files.length)return;
  const h=history[fotoIdx];
  if(!h.fotos)h.fotos={antes:[],depois:[]};
  if(!h.fotos[fotoTab])h.fotos[fotoTab]=[];

  let loaded=0;
  files.forEach(file=>{
    const reader=new FileReader();
    reader.onload=ev=>{
      h.fotos[fotoTab].push({
        src:ev.target.result,
        name:file.name,
        date:new Date().toLocaleDateString('pt-BR')
      });
      loaded++;
      if(loaded===files.length){
        saveHistory();
        renderFotoGrid();
        renderHistory(); // atualiza contador no botão
        notify(`${loaded} foto(s) adicionada(s) em "${fotoTab}".`);
      }
    };
    reader.readAsDataURL(file);
  });
  // limpar input para permitir re-upload do mesmo arquivo
  e.target.value='';
}

function handleFotoDrop(e){
  if(fotoIdx===null)return;
  const files=Array.from(e.dataTransfer.files).filter(f=>f.type.startsWith('image/'));
  if(!files.length)return;
  const h=history[fotoIdx];
  if(!h.fotos)h.fotos={antes:[],depois:[]};
  if(!h.fotos[fotoTab])h.fotos[fotoTab]=[];
  let loaded=0;
  files.forEach(file=>{
    const reader=new FileReader();
    reader.onload=ev=>{
      h.fotos[fotoTab].push({src:ev.target.result,name:file.name,date:new Date().toLocaleDateString('pt-BR')});
      loaded++;
      if(loaded===files.length){saveHistory();renderFotoGrid();renderHistory();notify(`${loaded} foto(s) adicionada(s).`);}
    };
    reader.readAsDataURL(file);
  });
}

function deleteFoto(tab,idx){
  if(fotoIdx===null)return;
  const h=history[fotoIdx];
  if(!h.fotos||!h.fotos[tab])return;
  h.fotos[tab].splice(idx,1);
  saveHistory();
  renderFotoGrid();
  renderHistory();
  notify('Foto removida.');
}

function renderFotoGrid(){
  if(fotoIdx===null)return;
  const h=history[fotoIdx];
  const fotos=(h.fotos&&h.fotos[fotoTab])||[];
  const container=document.getElementById('foto-grid-container');
  const color=fotoTab==='antes'?'#1565c0':'#2e7d32';
  const label=fotoTab==='antes'?'ANTES':'DEPOIS';

  if(!fotos.length){
    container.innerHTML=`<div class="foto-empty">📷 Nenhuma foto <strong>${label}</strong> ainda.<br><small>Use o botão acima para adicionar.</small></div>`;
    return;
  }

  container.innerHTML=`
    <div style="font-size:11px;font-weight:700;color:${color};margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em">
      ${label} — ${fotos.length} foto(s)
    </div>
    <div class="foto-grid">
      ${fotos.map((f,fi)=>`
        <div class="foto-card" onclick="openLightbox('${fotoTab}',${fi})">
          <img src="${f.src}" alt="${f.name}">
          <div class="foto-label">${f.date}</div>
          <button class="foto-del" onclick="event.stopPropagation();deleteFoto('${fotoTab}',${fi})">✕</button>
        </div>
      `).join('')}
    </div>`;
}

function saveHistory(){
  // Apenas atualiza o documento do registro que tem fotos modificadas (fotoIdx)
  if(fotoIdx === null) return;
  const h = history[fotoIdx];
  if(!h || !h._docId) return;
  setSyncStatus('saving');
  db.collection(COLLECTION).doc(h._docId).update({ fotos: h.fotos || {antes:[], depois:[]} })
    .then(() => setSyncStatus('ok'))
    .catch(e => { console.error(e); setSyncStatus('error'); notify('Erro ao salvar fotos.','err'); });
}

// ── Lightbox ──
function openLightbox(tab,startIdx){
  if(fotoIdx===null)return;
  const h=history[fotoIdx];
  lbImages=(h.fotos&&h.fotos[tab])||[];
  lbCurrent=startIdx;
  showLightboxSlide();
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox(){document.getElementById('lightbox').classList.remove('open');}
function lightboxNav(dir){
  lbCurrent=(lbCurrent+dir+lbImages.length)%lbImages.length;
  showLightboxSlide();
}
function showLightboxSlide(){
  if(!lbImages.length)return;
  const f=lbImages[lbCurrent];
  document.getElementById('lightbox-img').src=f.src;
  document.getElementById('lightbox-info').textContent=`${lbCurrent+1} / ${lbImages.length}  •  ${f.name}  •  ${f.date}`;
}

// Fechar lightbox com tecla Esc / setas
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(document.getElementById('lightbox').classList.contains('open'))closeLightbox();
    else closeFotoModal();
  }
  if(document.getElementById('lightbox').classList.contains('open')){
    if(e.key==='ArrowLeft')lightboxNav(-1);
    if(e.key==='ArrowRight')lightboxNav(1);
  }
});

// ══════════════════════════════════════════════════════════
//  EXPORTAR EXCEL — bordas + negrito nos títulos, sem cores
// ══════════════════════════════════════════════════════════
function exportExcel(){
  if(!history.length){notify('Nenhum registro para exportar.','err');return;}

  const sorted=[...history].sort((a,b)=>a.data.localeCompare(b.data));
  const porMes={};
  sorted.forEach(h=>{
    const k=mesKey(h.data);
    if(!porMes[k])porMes[k]=[];
    porMes[k].push(h);
  });

  // ── Borda fina preta em todos os lados
  const bdr={
    top:   {style:'thin',color:{argb:'FF000000'}},
    bottom:{style:'thin',color:{argb:'FF000000'}},
    left:  {style:'thin',color:{argb:'FF000000'}},
    right: {style:'thin',color:{argb:'FF000000'}}
  };

  // ── Construtores de célula
  function mkText(v, bold=false, halign='left', border=bdr){
    return {v, t:'s', s:{
      font:{name:'Arial', sz:10, bold},
      alignment:{horizontal:halign, vertical:'middle'},
      border
    }};
  }
  function mkNum(v, bold=false, halign='right', border=bdr){
    return {v, t:'n', s:{
      font:{name:'Arial', sz:10, bold},
      alignment:{horizontal:halign, vertical:'middle'},
      numFmt:'"R$ "#,##0.00',
      border
    }};
  }
  function empty(border=bdr){
    return {v:'', t:'z', s:{border}};
  }
  function spacerRow(){
    return [{v:'',t:'z'},{v:'',t:'z'},{v:'',t:'z'},{v:'',t:'z'}];
  }

  const wb=XLSX.utils.book_new();

  Object.keys(porMes).sort().forEach(k=>{
    const registros=porMes[k];
    const labelMes=mesLabel(k);
    const wsData=[];
    const rowH=[];
    let r=0;

    function addRow(row, hpt=18){ wsData.push(row); rowH.push({hpt}); r++; }

    // Linha de título que ocupa as 4 colunas com borda contínua (sem merge)
    // col A = texto em negrito, cols B-D = células vazias com borda
    function addTitle(txt, bold=true, hpt=18){
      addRow([
        mkText(txt, bold, 'left'),
        empty(), empty(), empty()
      ], hpt);
    }

    // ── Título da clínica
    addTitle('CLÍNICA SANTA MARTA — TABELA DE PREÇO CURATIVO', true, 20);

    // ── Demanda Mês
    addTitle('Demanda Mês — '+labelMes, true, 18);

    addRow(spacerRow(), 6);

    // ── Agrupar por paciente
    const pacientes={};
    registros.forEach(h=>{
      const key=h.nome.trim();
      if(!pacientes[key])pacientes[key]=[];
      pacientes[key].push(h);
    });

    Object.entries(pacientes).forEach(([nomePac,recs])=>{

      // ── Linha Paciente
      addTitle('Paciente: '+nomePac, true, 18);

      recs.forEach((rec,ri)=>{

        // ── Linha Atendimento
        const attLabel=`Atendimento ${ri+1} — Data: ${rec.data}  |  Problema: ${rec.problema}`;
        addTitle(attLabel, true, 16);

        // ── Cabeçalho das colunas (negrito, centralizado)
        addRow([
          mkText('Produto',             true, 'center'),
          mkText('Qtd',                 true, 'center'),
          mkText('Valor Unitário (R$)', true, 'center'),
          mkText('Total (R$)',          true, 'center'),
        ], 16);

        // ── Linhas de produto (sem negrito)
        rec.items.forEach(it=>{
          const p=PRODUTOS.find(x=>x.n===it.prod);
          const vc=p?p.vc:0;
          addRow([
            mkText(it.prod, false, 'left'),
            mkText(String(it.qty), false, 'center'),
            mkNum(vc),
            mkNum(vc*it.qty),
          ], 16);
        });

        // ── Linha Enfermeiro (se houver)
        if(rec.enfId){
          const e=ENFERMEIROS.find(x=>x.id===rec.enfId);
          if(e) addRow([
            mkText(`Enfermeiro(a) Responsável: ${e.nome} — ${e.cargo}`, true, 'left'),
            empty(), empty(), empty(),
          ], 16);
        }

        // ── Linha Mão de Obra (se houver)
        if(rec.moNivel && rec.moNivel!=='none' && rec.moTotal>0){
          const t=MAO_OBRA[rec.moNivel];
          const pf=rec.moPerfil||'B';
          const serv=(rec.moTotal*0.7).toFixed(2);
          const clin=(rec.moTotal*0.3).toFixed(2);
          addRow([
            mkText(`MÃO DE OBRA — ${t?t.label:rec.moNivel} / Perfil ${pf}  (70% Serviço: R$ ${serv}  |  30% Clínica: R$ ${clin})`, true, 'left'),
            mkText('1', false, 'center'),
            mkNum(rec.moTotal),
            mkNum(rec.moTotal),
          ], 16);
        }

        // ── Linha Total (negrito)
        addRow([
          empty(), empty(),
          mkText('TOTAL DO ATENDIMENTO', true, 'right'),
          mkNum(rec.total, true),
        ], 16);

        addRow(spacerRow(), 6);
      });

      addRow(spacerRow(), 6);
    });

    const ws=XLSX.utils.aoa_to_sheet(wsData);
    ws['!cols']=[{wch:52},{wch:7},{wch:22},{wch:16}];
    ws['!rows']=rowH;

    const sheetName=labelMes.replace(' / ','-').slice(0,31).replace(/[\\/?*[\]]/g,'');
    XLSX.utils.book_append_sheet(wb,ws,sheetName||k);
  });

  const dateStr=new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb,`Historico_Curativos_${dateStr}.xlsx`);
  notify(`Excel exportado — ${Object.keys(porMes).length} aba(s) por mês!`);
}

renderAtendimentos();
initFirestore(); // carrega dados do Firebase em tempo real
</script>
